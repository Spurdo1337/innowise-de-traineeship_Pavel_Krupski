services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  airflow-webserver:
    build: .
    image: airline-airflow:latest
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      # Populates the apache-airflow-providers-snowflake default
      # connection from the same SNOWFLAKE_* values already in .env, so
      # @task.snowpark / SnowflakeHook work without any extra manual setup
      # in the Airflow UI. JSON (not the snowflake:// URI form) is used
      # deliberately: a password containing "@" would otherwise be
      # misparsed as the URI's user/host separator.
      AIRFLOW_CONN_SNOWFLAKE_DEFAULT: >-
        {"conn_type": "snowflake", "login": "${SNOWFLAKE_USER}", "password": "${SNOWFLAKE_PASSWORD}",
        "extra": {"account": "${SNOWFLAKE_ACCOUNT}", "database": "${SNOWFLAKE_DATABASE}",
        "warehouse": "${SNOWFLAKE_WAREHOUSE}", "role": "${SNOWFLAKE_ROLE}"}}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./snowflake:/opt/airflow/snowflake
      - ./logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: webserver
    restart: always

  airflow-scheduler:
    image: airline-airflow:latest
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      AIRFLOW_CONN_SNOWFLAKE_DEFAULT: >-
        {"conn_type": "snowflake", "login": "${SNOWFLAKE_USER}", "password": "${SNOWFLAKE_PASSWORD}",
        "extra": {"account": "${SNOWFLAKE_ACCOUNT}", "database": "${SNOWFLAKE_DATABASE}",
        "warehouse": "${SNOWFLAKE_WAREHOUSE}", "role": "${SNOWFLAKE_ROLE}"}}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./snowflake:/opt/airflow/snowflake
      - ./logs:/opt/airflow/logs
    command: scheduler
    restart: always

  airflow-init:
    image: airline-airflow:latest
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./snowflake:/opt/airflow/snowflake
      - ./logs:/opt/airflow/logs
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create           --username "${AIRFLOW_ADMIN_USERNAME}"           --password "${AIRFLOW_ADMIN_PASSWORD}"           --firstname Airflow           --lastname Admin           --role Admin           --email "${AIRFLOW_ADMIN_EMAIL}" || true
    restart: "no"

volumes:
  postgres-db-volume:
