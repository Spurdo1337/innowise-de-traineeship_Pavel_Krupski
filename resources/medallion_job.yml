# Orchestration of the whole workflow on serverless compute. Tasks run in this order:
# setup -> bronze -> driver files and stream in two phases -> time travel and RESTORE -> silver -> gold -> DLT -> report.
# Serverless environment with faker (client 1), the same as in the successful run. Notebooks also run %pip.
resources:
  jobs:
    medallion_pipeline:
      name: medallion-pipeline
      description: "Medallion workflow on serverless compute: setup, bronze, driver files and stream, time travel, silver, gold, DLT, JSON report."
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - faker
      tasks:
        - task_key: setup
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/00_setup.py

        - task_key: bronze_batch
          environment_key: default
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/01_bronze_batch_ingest.py

        - task_key: drivers_landing_for_dlt
          environment_key: default
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/04_generate_drivers_landing.py
            base_parameters:
              num_events: "6000"

        - task_key: gen_driver_files_phase1
          environment_key: default
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/02a_generate_driver_files.py
            base_parameters:
              phase: "1"

        - task_key: drivers_stream_phase1
          environment_key: default
          depends_on:
            - task_key: gen_driver_files_phase1
          notebook_task:
            notebook_path: ../notebooks/02_bronze_drivers_stream.py
            base_parameters:
              phase: "1"

        - task_key: gen_driver_files_phase2
          environment_key: default
          depends_on:
            - task_key: drivers_stream_phase1
          notebook_task:
            notebook_path: ../notebooks/02a_generate_driver_files.py
            base_parameters:
              phase: "2"

        - task_key: drivers_stream_phase2
          environment_key: default
          depends_on:
            - task_key: gen_driver_files_phase2
          notebook_task:
            notebook_path: ../notebooks/02_bronze_drivers_stream.py
            base_parameters:
              phase: "2"

        - task_key: drivers_time_travel_restore
          environment_key: default
          depends_on:
            - task_key: drivers_stream_phase2
          notebook_task:
            notebook_path: ../notebooks/03_time_travel_and_restore.py

        - task_key: silver
          environment_key: default
          depends_on:
            - task_key: bronze_batch
            - task_key: drivers_time_travel_restore
          notebook_task:
            notebook_path: ../notebooks/05_silver.py

        - task_key: gold_metrics
          environment_key: default
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/06_gold_metrics.py

        - task_key: gold_enriched_trips
          environment_key: default
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/07_gold_enriched_trips.py

        - task_key: dlt_pipeline
          depends_on:
            - task_key: drivers_landing_for_dlt
          pipeline_task:
            pipeline_id: ${resources.pipelines.medallion_dlt.id}

        - task_key: report
          environment_key: default
          depends_on:
            - task_key: gold_metrics
            - task_key: gold_enriched_trips
            - task_key: dlt_pipeline
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../notebooks/08_report.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
